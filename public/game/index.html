<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Runescape by Andrew Gower</title>
    <style>
      body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh; }
      canvas { display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; height: 100%; }
    </style>

    <!-- WebSocket URL rewriter: MUST run before classes.js loads -->
    <script>
    (function() {
        var NativeWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
            if (typeof url === "string" && (url.indexOf("127.0.0.1") !== -1 || url.indexOf("localhost") !== -1)) {
              // PVP Arena realm: the iframe hash carries port 43595 (server 2).
              // Route through the /arena/ nginx location -> 127.0.0.1:43495.
              var m = window.location.hash.match(/,43595,/);
              url = m ? "wss://game.r2hrsc.xyz/arena/" : "wss://game.r2hrsc.xyz";
            }
            var ws;
            if (protocols) { ws = new NativeWebSocket(url, protocols); }
            else { ws = new NativeWebSocket(url); }
            ws.addEventListener("open", function() {
                window._r2h_ws_open = true;
            });
            ws.addEventListener("close", function() {
                try { window.parent.postMessage({ type: "RSC_DISCONNECT" }, "*"); } catch(e) {}
            });
            window._r2h_ws = ws;
            return ws;
        };
        window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        window.WebSocket.OPEN = NativeWebSocket.OPEN;
        window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
        window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket.prototype = NativeWebSocket.prototype;
    })();
    </script>

    <!-- Force desktop UA: MUST run before classes.js so TeaVM uses canvas keydown path -->
    <script>
    (function() {

        Object.defineProperty(navigator, 'userAgent', {
          get: function() { return 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'; },
          configurable: true
        });

    <!-- R2H Login Bridge: captures canvas event handlers. MUST run before main() -->
    <script>
    (function() {
      'use strict';
      window.__r2hKeyDownHandler = null;
      window.__r2hCanvasRef = null;
      var origAddEventListener = EventTarget.prototype.addEventListener;
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        if (this && this.tagName === 'CANVAS') {
          if (type === 'keydown') window.__r2hKeyDownHandler = listener;
          if (type === 'mousedown' || type === 'touchstart' || type === 'pointerdown') {
            window.__r2hCanvasRef = this;
            window['__r2hMouseHandler_' + type] = listener;
          }
        }
        return origAddEventListener.call(this, type, listener, options);
      };
      window.__r2hTypeChar = function(ch) {
        if (!window.__r2hKeyDownHandler || !window.__r2hCanvasRef) return false;
        var kc = ch.toUpperCase().charCodeAt(0);
        window.__r2hKeyDownHandler.call(window.__r2hCanvasRef, new KeyboardEvent('keydown', {
          key: ch, code: 'Key' + ch.toUpperCase(), keyCode: kc, which: kc, charCode: 0, bubbles: true, cancelable: true
        }));
        return true;
      };
      window.__r2hTypeSpecial = function(key) {
        if (!window.__r2hKeyDownHandler || !window.__r2hCanvasRef) return false;
        var kc = key === 'Tab' ? 9 : 13;
        window.__r2hKeyDownHandler.call(window.__r2hCanvasRef, new KeyboardEvent('keydown', {
          key: key, code: key, keyCode: kc, which: kc, charCode: 0, bubbles: true, cancelable: true
        }));
        return true;
      };
    })();
    </script>

    <!-- R2H Login Fix: intercept first WS send and replace with custom client login -->
    <script>
    (function() {
        var origSend = WebSocket.prototype.send;
        var loginSent = false;
        WebSocket.prototype.send = function(data) {
            if (!loginSent && data && (data.byteLength || (data.buffer && data.buffer.byteLength)) > 10) {
                loginSent = true;
                var u = window.__r2h_login_user || '';
                var p = window.__r2h_login_pass || '';
                if (!u || !p) { return origSend.call(this, data); }
                var VERSION = 10009;
                var payload = [];
                payload.push(0);
                payload.push((VERSION >> 24) & 0xFF, (VERSION >> 16) & 0xFF, (VERSION >> 8) & 0xFF, VERSION & 0xFF);
                for (var i = 0; i < u.length; i++) payload.push(u.charCodeAt(i));
                payload.push(10);
                for (var i = 0; i < p.length; i++) payload.push(p.charCodeAt(i));
                payload.push(10);
                for (var i = 0; i < 8; i++) payload.push(Math.floor(Math.random() * 256));
                var contentLen = payload.length + 1;
                var pkt = new ArrayBuffer(2 + contentLen);
                var v = new DataView(pkt);
                v.setUint16(0, contentLen, false);
                v.setUint8(2, 0);
                for (var i = 0; i < payload.length; i++) v.setUint8(3 + i, payload[i]);
                console.log('[R2H] Custom login: ' + pkt.byteLength + 'B (replaced ' + data.byteLength + 'B)');
                return origSend.call(this, pkt);
            }
            return origSend.call(this, data);
        };
    })();
    </script>

    <!-- Mobile touch fix: long-press right-click only. Browser handles regular taps natively. -->
    <script>
    (function() {
      'use strict';

      function getCanvas() { return document.querySelector('canvas'); }

      function setupTouchHandlers() {
        var canvas = getCanvas();
        if (!canvas) { setTimeout(setupTouchHandlers, 500); return; }

        var holdTimer = null;
        var holdStartX = 0, holdStartY = 0;
        var rightClickActive = false;  // true while finger is down and right-click fired
        var menuOpen = false;          // true after right-click menu is shown, until next tap

        // ── touchstart: decide if this is a tap or a hold ──
        canvas.addEventListener('touchstart', function(e) {
          if (!e.touches || !e.touches[0]) return;
          var t = e.touches[0];

          // If a menu is open, this tap selects/dismisses — let it through
          if (menuOpen) {
            menuOpen = false;
            return; // Don't start hold timer — let the browser's tap go through
          }

          holdStartX = t.clientX;
          holdStartY = t.clientY;
          rightClickActive = false;

          // Slight hold = right-click. 120ms is the shortest time that
          // doesn't trigger on quick taps but feels instant.
          holdTimer = setTimeout(function() {
            rightClickActive = true;
            var handler = window.__r2hMouseHandler_mousedown;
            if (handler) {
              handler.call(canvas, new MouseEvent('mousedown', {
                clientX: t.clientX,
                clientY: t.clientY,
                button: 2,
                buttons: 2,
                bubbles: true, cancelable: true
              }));
            }
          }, 80);
        }, { passive: true });

        // ── touchmove: cancel hold if finger moved (scrolling/dragging) ──
        canvas.addEventListener('touchmove', function(e) {
          if (!e.touches || !e.touches[0]) return;
          var t = e.touches[0];
          if (Math.abs(t.clientX - holdStartX) > 10 || Math.abs(t.clientY - holdStartY) > 10) {
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          }
        }, { passive: true });

        // ── Block ALL synthetic mouse events while right-click is active ──
        // The browser fires mousedown→mouseup→click on finger release.
        // These close the right-click menu. Block them all.
        ['mousedown', 'mouseup', 'click'].forEach(function(evt) {
          canvas.addEventListener(evt, function(e) {
            if (rightClickActive || menuOpen) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }, true);
        });

        // ── touchend: if right-click fired, enter menu mode ──
        canvas.addEventListener('touchend', function(e) {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          if (rightClickActive) {
            e.preventDefault();
            rightClickActive = false;
            menuOpen = true; // Menu stays open until next touchstart
          }
        });

        canvas.addEventListener('touchcancel', function() {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          rightClickActive = false;
        }, { passive: true });

        console.log('[R2H] Touch handlers attached (120ms hold = right-click)');
      }

      setTimeout(setupTouchHandlers, 3000);
    })();
    </script>

    <!-- R2H Activity Monitor (Phase 1 letterbox panel): read-only. Polls the game's
         own stat arrays (mc.kN XP / mc.fw base / mc.hy current) + inventory every 2s
         and postMessages DELTAS to the parent for the side-panel ticker.
         Field names verified in the sealed bot engine (statXp:'kN', statBase:'fw',
         statCurrent:'hy', invItemId:'b4', invAmount:'e2', invCount:'cU', bank:'lD').
         Bank/shop dialogs gate loot detection (withdrawals are NOT loot). -->
    <script>
    (function() {
      'use strict';
      var SKILL_NAMES = ['Attack','Defense','Strength','Hits','Ranged','Prayer','Magic',
        'Cooking','Woodcutting','Fletching','Fishing','Firemaking','Crafting','Smithing',
        'Mining','Herblaw','Agility','Thieving'];
      var lastXp = null, lastBase = null, lastInv = null;

      function snapshot(mc) {
        var xp = [], base = [];
        var xpArr = mc.kN && mc.kN.data, baseArr = mc.fw && mc.fw.data;
        for (var i = 0; i < 18; i++) {
          xp.push(xpArr ? (xpArr[i] || 0) : 0);
          base.push(baseArr ? (baseArr[i] || 0) : 0);
        }
        // inventory: aggregate count per item id (slots 0..cU)
        var inv = {};
        var ids = mc.b4 && mc.b4.data, amts = mc.e2 && mc.e2.data;
        var n = mc.cU || 0;
        for (var s = 0; s < n && s < 30; s++) {
          var id = ids ? ids[s] : 0;
          if (!id) continue;
          inv[id] = (inv[id] || 0) + ((amts && amts[s]) ? amts[s] : 1);
        }
        return { xp: xp, base: base, inv: inv };
      }

      function poll() {
        try {
          var mc = window.__r2h_mc;
          if (!mc || !mc.kN || !mc.kN.data) { setTimeout(poll, 2000); return; }
          var snap = snapshot(mc);
          var events = [];

          if (lastXp) {
            for (var i = 0; i < 18; i++) {
              var d = snap.xp[i] - lastXp[i];
              if (d > 0) {
                var leveled = snap.base[i] > lastBase[i];
                events.push({ kind: leveled ? 'level' : 'xp', skill: i,
                  skillName: SKILL_NAMES[i] || ('skill ' + i), xpGain: d,
                  level: snap.base[i] });
              }
            }
            // loot: inventory gains while NO dialog is open (bank 'lD', shop 'lv')
            if (!mc.lD && !mc.lv) {
              var invEvents = [];
              for (var id in snap.inv) {
                var gain = snap.inv[id] - (lastInv[id] || 0);
                if (gain > 0) invEvents.push({ kind: 'loot', itemId: parseInt(id, 10), count: gain });
              }
              // one event per tick, batched — parent renders a single line
              if (invEvents.length > 0) events.push({ kind: 'lootBatch', items: invEvents });
            }
          }

          if (events.length > 0 && window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'R2H_ACTIVITY', events: events }, '*');
          }
          lastXp = snap.xp; lastBase = snap.base; lastInv = snap.inv;
        } catch (e) { /* never break the game page */ }
        setTimeout(poll, 2000);
      }
      setTimeout(poll, 5000);
    })();
    </script>

    <!-- R2H Area Popup + Position Poller (v1, 2026-09-29 — plan §6).
         READ-ONLY: polls the game's own coordinate fields and postMessages them to the
         parent. Never writes to the client, never sends anything to any server.
         The ONLY local UI is a label above the player's own head (visible only to
         this player).

         ⚠️ FIELD NAMES ARE MINIFIED AND VERSION-SPECIFIC: bJ/bK = player local tile,
         du/dd = region base. These were verified against the live classes.js
         (r2h-bot-engine.js getX/getY, sealed v423). After ANY client rebuild /
         classes.js update, re-verify these names before trusting the popup:
           window.__r2h_mc && [__r2h_mc.bJ, __r2h_mc.du, __r2h_mc.bK, __r2h_mc.dd]
         If they are missing/non-numeric, the poller self-disables (fails safe:
         no popup, no wrong position). -->
    <script>
    (function() {
      'use strict';

      // ---- Arena guard: the area popup is a main-world feature. ----
      // The iframe hash carries the realm port (43595 = PVP Arena).
      if (/,43595,/.test(window.location.hash)) { return; }

      // ---- Config ----
      var POLL_MS = 500;          // position poll cadence
      var POPUP_MS = 2600;        // how long the area label stays visible
      var REARM_MS = 12000;       // min time before the SAME area can re-popup
      var WORLD_MAX_X = 944;      // server Constants: MAX_WIDTH=1008, practical playable < 944
      var WORLD_MAX_Y = 3776;     // server Constants: MAX_HEIGHT=4032, practical 4 floors * 944

      var FLOOR_LOCAL_MAX = 944;

      var areas = null;           // fetched from areas.json (same directory)
      var areasReady = false;

      // Popup state
      var popupEl = null;
      var popupHideTimer = null;
      var lastAreaId = null;
      var lastAreaSince = 0;
      var popupHistory = {};      // areaId -> timestamp of last popup

      // Position stabilization: the client's coordinate fields can hold
      // transient garbage in the moments after world entry (e.g. bK=0 while
      // region data loads) — a single in-range reading is NOT proof. We only
      // trust a position after STABLE_N consecutive identical readings, and
      // ignore everything in the first SETTLE_MS after entering the world.
      var STABLE_N = 2;           // consecutive identical readings required
      var SETTLE_MS = 2500;        // blind window after world entry
      var wasInWorld = false;      // tracks fv 0→1 transition
      var worldEnteredAt = 0;
      var stablePos = null;        // last raw {x,y} reading
      var stableCount = 0;

      function fetchAreas() {
        try {
          var x = new XMLHttpRequest();
          x.open('GET', 'areas.json?v=1', true);
          x.onload = function() {
            try {
              var j = JSON.parse(x.responseText);
              areas = (j && j.areas) ? j.areas : [];
              areasReady = areas.length > 0;
            } catch (e) { areas = null; areasReady = false; }
          };
          x.send();
        } catch (e) { /* no areas = no popup, fail safe */ }
      }

      // Classic RSC yellow overhead-text style.
      // The local player is always at the CENTRE of the viewport, so "above my own
      // head" = slightly above canvas centre. pointer-events:none so it can NEVER
      // block a game click/touch.
      function ensurePopupEl() {
        if (popupEl) return popupEl;
        var d = document.createElement('div');
        d.id = 'r2h-area-popup';
        d.setAttribute('aria-hidden', 'true');
        d.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);'
          + 'top:calc(38% - 26px);'
          + 'font-family:monospace;font-weight:bold;'
          + 'color:#ffff00;text-shadow:1px 1px 0 #000;'
          + 'background:transparent;pointer-events:none;z-index:5;'
          + 'white-space:nowrap;opacity:0;transition:opacity .25s ease;'
          + '-webkit-user-select:none;user-select:none;'
          + 'font-size:clamp(11px, 2.6vmin, 15px);';
        document.body.appendChild(d);
        return d;
      }

      function showPopup(text) {
        var el = ensurePopupEl();
        el.textContent = text;
        el.style.opacity = '1';
        if (popupHideTimer) clearTimeout(popupHideTimer);
        // hide after POPUP_MS (fade via transition)
        popupHideTimer = setTimeout(function() {
          el.style.opacity = '0';
        }, POPUP_MS);
      }

      // Wilderness level — SAME formula as server Point.wildernessLevel():
      //   wild = 2203 - (rawY + (1776 - 944*floor)); level = wild > 0 ? 1 + wild/6 : 0
      // (with rawY = localY + 944*floor this algebraically reduces to 427 - localY
      //  on EVERY floor — keep the server-shaped expression for auditability)
      function wildernessLevel(x, rawY, floor) {
        if (x + 2304 >= 2640) return 0; // server: x >= 336 is never wilderness
        var wild = 2203 - (rawY + (1776 - (944 * floor)));
        return wild > 0 ? 1 + Math.floor(wild / 6) : 0;
      }

      // Find the area for (x, localY, floor). Returns the area object or null.
      // Priority: explicit wilderness rect > bank > town > dungeon > kingdom.
      function findArea(x, localY, floor) {
        if (!areasReady) return null;
        var best = null, bestPri = -1;
        for (var i = 0; i < areas.length; i++) {
          var a = areas[i];
          if (floorsMatch(a, floor) && x >= a.x1 && x <= a.x2 && localY >= a.y1 && localY <= a.y2) {
            // NOTE: banks are map-labels only (popup:false) — they never win the
            // popup, so a player at the bank still gets the town popup.
            var pri = a.type === 'wilderness' ? 5 : a.type === 'dungeon' ? 3 : a.type === 'town' ? 2 : a.type === 'kingdom' ? 1 : 0;
            if (pri > bestPri) { best = a; bestPri = pri; }
          }
        }
        return best;
      }

      function floorsMatch(a, floor) {
        for (var i = 0; i < a.floors.length; i++) if (a.floors[i] === floor) return true;
        return false;
      }

      function areaDisplayName(a, x, rawY, floor) {
        if (a.type === 'wilderness') {
          var lvl = wildernessLevel(x, rawY, floor);
          return lvl > 0 ? ('Wilderness · Level ' + lvl) : 'Wilderness';
        }
        return a.name;
      }

      // Read + validate the player's position. Returns {x, y, floor, localY} or null.
      // ANY doubt (missing fields, non-numbers, out-of-range) → null (hide popup).
      function readPosition(mc) {
        try {
          var bJ = mc.bJ, bK = mc.bK, du = mc.du, dd = mc.dd;
          if (bJ === undefined || bK === undefined || du === undefined || dd === undefined) return null;
          // TeaVM numerics can surface as strings — coerce, then verify.
          var x = Number(bJ) + Number(du);
          var y = Number(bK) + Number(dd);
          if (!isFinite(x) || !isFinite(y)) return null;
          x = Math.trunc(x); y = Math.trunc(y);
          var floor = Math.floor(y / 944);
          var localY = y - 944 * floor;
          if (x < 0 || x > WORLD_MAX_X) return null;
          if (floor < 0 || floor > 3) return null;
          if (localY < 0 || localY > FLOOR_LOCAL_MAX) return null;
          return { x: x, y: y, floor: floor, localY: localY };
        } catch (e) { return null; }
      }

      function tick() {
        try {
          var mc = window.__r2h_mc;
          var inWorld = !!(mc && mc.fv === 1);
          if (inWorld && !wasInWorld) {
            // world-entry transition: open the settle window and drop all state
            worldEnteredAt = Date.now();
            stablePos = null; stableCount = 0;
          }
          wasInWorld = inWorld;
          if (!inWorld) { maybeLeaving(); return; } // not in world → clear state
          if (Date.now() - worldEnteredAt < SETTLE_MS) return; // settle window
          var pos = readPosition(mc);
          if (!pos || (stablePos && (stablePos.x !== pos.x || stablePos.y !== pos.y))) {
            // moved (normal) OR invalid → restart the stability counter
            stablePos = pos ? { x: pos.x, y: pos.y } : null;
            stableCount = pos ? 1 : 0;
            if (!pos) maybeLeaving(); // FAIL SAFE: bad field → hide, post nothing
            return;
          }
          stableCount++;
          if (stableCount < STABLE_N) return; // not stable yet → show nothing
          var a = findArea(pos.x, pos.localY, pos.floor);
          handleArea(a, pos);
          // feed the parent (future map overlay); parent ignores if unseen
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'R2H_POSITION', x: pos.x, y: pos.y, floor: pos.floor }, '*');
          }
        } catch (e) { /* never break the game page */ }
      }

      function handleArea(a, pos) {
        var now = Date.now();
        var id = a ? a.id : null;
        if (id !== lastAreaId) {
          // area CHANGED
          if (lastAreaId) {
            // Leaving a named area → "Leaving X" (unless we've re-armed quickly: anti-flicker)
            var prevDef = areaById(lastAreaId);
            if (prevDef && prevDef.popup) {
              if (now - lastAreaSince >= 1500) {
                showPopup('Leaving ' + prevDef.name);
              }
            }
          }
          if (a && a.popup) {
            var lastShown = popupHistory[id] || 0;
            if (now - lastShown >= REARM_MS) {
              showPopup('Entering ' + areaDisplayName(a, pos.x, pos.y, pos.floor));
              popupHistory[id] = now;
            }
          }
          lastAreaId = id; lastAreaSince = now;
        }
        // same area: nothing (re-arm timer handled by popupHistory)
      }

      function maybeLeaving() {
        // clear popup state when leaving the world (logout), keep the DOM clean
        if (lastAreaId !== null) {
          lastAreaId = null; lastAreaSince = 0;
        }
        stablePos = null; stableCount = 0;
        if (popupEl) popupEl.style.opacity = '0';
      }

      function areaById(id) {
        for (var i = 0; i < areas.length; i++) if (areas[i].id === id) return areas[i];
        return null;
      }

      fetchAreas();
      setTimeout(function loop() {
        tick();
        setTimeout(loop, POLL_MS);
      }, 5000);
    })();
    </script>

  <body>
    <!-- TeaVM game classes (with resume patch + exposed functions) -->
    <script type="text/javascript" charset="utf-8" src="teavm/classes.js?v=v232"></script>
    <!-- Boot the game -->
    <script>main();</script>

    <!-- RSC_LOGIN handler: receives credentials from parent, calls Ob() in TeaVM thread -->
    <script>
    (function() {
      'use strict';
      var _loginActive = false;
      var _loginDone = false;

      window.addEventListener('message', function(e) {
        if (e.origin !== 'https://r2hrsc.xyz' && e.origin !== 'https://www.r2hrsc.xyz' && e.origin !== 'https://robinscape.xyz' && e.origin !== 'https://www.robinscape.xyz') return;
        if (!e.data || e.data.type !== 'RSC_LOGIN') return;

        var username = e.data.username;
        var password = e.data.password;
        window.__r2h_login_user = username;
        window.__r2h_login_pass = password;
        window.parent.postMessage({ type: 'rsc-login-received' }, '*');

        if (_loginDone || _loginActive) {
          window.parent.postMessage({ type: 'rsc-login-complete' }, '*');
          return;
        }
        _loginActive = true;

        function runLoginSequence() {
          var mcWaitCount = 0;
          var mcWaitInterval = setInterval(function() {
            mcWaitCount++;
            if (!window.__r2h_mc) {
              if (mcWaitCount > 300) {
                clearInterval(mcWaitInterval);
                window.parent.postMessage({ type: 'rsc-login-error', detail: 'Game engine not ready' }, '*');
                _loginActive = false;
              }
              return;
            }
            var mc = window.__r2h_mc;
            if (!mc.Y || (!mc.g1 && mc.g1 !== 0) || (!mc.uw && mc.uw !== 0)) {
              if (mcWaitCount > 300) {
                clearInterval(mcWaitInterval);
                window.parent.postMessage({ type: 'rsc-login-error', detail: 'Login screen not ready' }, '*');
                _loginActive = false;
              }
              return;
            }
            if (mc.g1 === 0 && mc.g2 === 0) return;

            clearInterval(mcWaitInterval);
            try {
              var rscUser = window.__r2h_rt_str(username);
              var rscPass = window.__r2h_rt_str(password);
              mc.eN = rscUser;
              mc.eD = rscPass;
              window.__r2h_startThread(function() {
                window.__r2h_Ob(mc, rscUser, rscPass, false);
              });
            } catch(e) {
              window.parent.postMessage({ type: 'rsc-login-error', detail: 'Login failed: ' + e.message }, '*');
              _loginActive = false;
              return;
            }

            var checkStart = Date.now();
            var checkInterval = setInterval(function() {
              if (window._r2h_ws_open) {
                clearInterval(checkInterval);
                _loginDone = true;
                window.parent.postMessage({ type: 'rsc-login-complete' }, '*');
                _loginActive = false;
              } else if (Date.now() - checkStart > 30000) {
                clearInterval(checkInterval);
                window.parent.postMessage({ type: 'rsc-login-error', detail: 'Login timed out' }, '*');
                _loginActive = false;
              }
            }, 500);
          }, 200);
        }

        var waitCount = 0;
        var waitInterval = setInterval(function() {
          var canvas = document.querySelector('canvas');
          waitCount++;
          if (canvas && canvas.width > 100) {
            clearInterval(waitInterval);
            setTimeout(runLoginSequence, 2000);
          } else if (waitCount > 300) {
            clearInterval(waitInterval);
            window.parent.postMessage({ type: 'rsc-login-error', detail: 'Game canvas not ready' }, '*');
            _loginActive = false;
          }
        }, 200);
      });
    })();

    // ── R2H LOGIN SCREEN OVERLAY (custom art) ────────────────────────────
    // Full-screen login art over the client-drawn login screen (welcome +
    // credentials form). Art: login-logo.png, designed at 512x345 (the game's
    // fixed internal resolution), stretched 100%x100% to match the canvas
    // pixel-for-pixel at any zoom/scale.
    // Hide conditions (any): _r2h_ws_open (logged in), _r2h_login_fail,
    // bot panel open, tab hidden, or loginScreen not in {0,2}.
    var __r2hLoginBox = document.createElement('div');
    __r2hLoginBox.id = 'r2h-login-logo-box';
    __r2hLoginBox.style.cssText =
      'position:absolute;left:0;top:0;width:100%;height:100%;' +
      'background:#000 url(login-logo.png) no-repeat center/100% 100%;' +
      'z-index:5;pointer-events:none;display:none;';
    document.body.appendChild(__r2hLoginBox);

    (function() {
      'use strict';
      var box = document.getElementById('r2h-login-logo-box');
      if (!box) return;
      var shown = false;

      function currentOverlayState() {
        return false; // REVERTED-TO-ORIGINAL-ART 2026-09-24: never show custom overlay (use game's own login art)
        // Hide ONLY when the CLIENT says it's in-game (mc.fv = loggedIn:
        // 0=login screens, 1=game world — classes.js offset ~66698:
        // !fv→drawLoginScreens, fv==1→drawGame). Never hide on _r2h_ws_open:
        // the socket opens while the client is still drawing its own login
        // screen — hiding there is what flashed the old login art on entry.
        var mc = window.__r2h_mc;
        if (mc && mc.fv === 1) return false;            // in game world
        if (window._r2h_login_fail) return false;       // login errored — show client msg
        if (window.__r2h_bot_panel_open) return false;  // bot panel overlaying game
        if (document.hidden) return false;              // tab hidden
        if (!mc) return true;                           // engine pre-boot: welcome screen
        return mc.bM === 0 || mc.bM === 2;              // loginScreen 0/2 = logo visible
      }

      function tick() {
        var want = currentOverlayState();
        if (want !== shown) {
          shown = want;
          box.style.display = want ? 'block' : 'none';
        }
      }
      setInterval(tick, 250);
      tick();
    })();
    // ── END R2H LOGIN SCREEN OVERLAY ─────────────────────────────────────
  </script>
  </body>
</html>
