<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Runescape by Andrew Gower</title>
    <style>
      body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh; }
      canvas { display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; width: 100%; height: 100%; }
    </style>

    <!-- WebSocket URL rewriter: MUST run before classes.js loads -->
    <script>
    (function() {
        var NativeWebSocket = window.WebSocket;
        window.WebSocket = function(url, protocols) {
            if (typeof url === "string" && (url.indexOf("127.0.0.1") !== -1 || url.indexOf("localhost") !== -1)) {
              // [PHASE 4 / 2026-09-30] Multiworld routing. The iframe hash carries the GAME
              // port (435xx); each maps to a public nginx route that proxies to the matching
              // WEBSOCKET port (434xx). The two ranges are 100 apart -- 43596 -> /world3/ ->
              // :43496 is CORRECT, do not "fix" it.
              // Hardcoded literals only: nothing from the hash is used to build a path, so
              // nginx's catch-all (which would silently proxy an unknown path to world 1) is
              // unreachable from here. An unknown or absent port falls back to world 1,
              // exactly as the previous arena-only code did.
              var R2H_WS = {
                "43594": "wss://game.r2hrsc.xyz",
                "43595": "wss://game.r2hrsc.xyz/arena/",
                "43596": "wss://game.r2hrsc.xyz/world3/",
                "43597": "wss://game.r2hrsc.xyz/world4/",
                "43598": "wss://game.r2hrsc.xyz/world5/",
                "43599": "wss://game.r2hrsc.xyz/world6/",
                "43600": "wss://game.r2hrsc.xyz/world7/"
              };
              var m = window.location.hash.match(/,(43[0-9]{3}),/);
              var portKey = m ? m[1] : "43594";
              url = R2H_WS[portKey] || "wss://game.r2hrsc.xyz";
            }
            var ws;
            if (protocols) { ws = new NativeWebSocket(url, protocols); }
            else { ws = new NativeWebSocket(url); }
            ws.addEventListener("open", function() {
                window._r2h_ws_open = true;
            });
            // LOGOUT DETECTION. `wasClean` is useless here: the server ends a
            // session with a bare channel.close() and never sends a websocket
            // close frame, so EVERY close arrives as 1006/not-clean whether the
            // player logged out or the link died. Checking it was my mistake.
            //
            // What IS reliable: the client announces a logout before the socket
            // dies. The web client speaks Payload177 (Player.java picks it for
            // clientVersion >= 10000 over websocket), where the outgoing opcodes
            // are 6 = LOGOUT and 1 = CONFIRM_LOGOUT, framed as [length][opcode].
            // A no-payload packet is therefore the two bytes [1][6] or [1][1].
            // ORDERING, NOT A SNAPSHOT. The discriminator between a logout and
            // a drop is WHICH HAPPENED FIRST: on a logout the client leaves the
            // world (fv 1 -> 0) and then the socket dies; on a drop the socket
            // dies first and the client only notices later. Sampling fv at the
            // close event is racy — if both land in the same tick the answer is
            // arbitrary. So record the transition and compare timestamps.
            if (!window.__r2hFvWatch) {
                window.__r2hFvWatch = { zeroAt: 0, lastOne: 0 };
                setInterval(function () {
                    try {
                        var m = window.__r2h_mc;
                        if (!m) return;
                        if (m.fv === 1) {
                            window.__r2hFvWatch.lastOne = Date.now();
                            window.__r2hFvWatch.zeroAt = 0;
                            window.__r2hFvWatch.leftWhileOpen = false;
                        } else if (!window.__r2hFvWatch.zeroAt && window.__r2hFvWatch.lastOne) {
                            window.__r2hFvWatch.zeroAt = Date.now();
                            // THE AIRTIGHT ONE. A network failure cannot make the
                            // client leave the game world while the socket is
                            // still OPEN — only the client deciding to leave can
                            // do that, i.e. the player logging out, or the
                            // client's own 2-minute idle logout (mc.d4 > 4500).
                            // If the socket is already closing/closed, the client
                            // is merely reacting to a drop.
                            try {
                                var sock = window._r2h_ws;
                                window.__r2hFvWatch.leftWhileOpen =
                                    !!sock && sock.readyState === 1; // 1 = OPEN
                            } catch (e2) { window.__r2hFvWatch.leftWhileOpen = false; }
                        }
                    } catch (err) { /* ignore */ }
                }, 150);
            }

            var r2hLogoutSentAt = 0;
            var nativeSend = ws.send.bind(ws);
            ws.send = function(data) {
                try {
                    var b = null;
                    if (data instanceof ArrayBuffer) b = new Uint8Array(data);
                    else if (data && data.buffer instanceof ArrayBuffer) b = new Uint8Array(data.buffer, data.byteOffset || 0, data.byteLength);
                    if (b && b.length === 2 && b[0] === 1 && (b[1] === 6 || b[1] === 1)) {
                        r2hLogoutSentAt = Date.now();
                    }
                } catch (err) { /* never break the game over telemetry */ }
                return nativeSend(data);
            };

            ws.addEventListener("close", function(e) {
                var info = { type: "RSC_DISCONNECT", code: e && e.code, wasClean: !!(e && e.wasClean) };
                try {
                    info.logoutSentMsAgo = r2hLogoutSentAt ? (Date.now() - r2hLogoutSentAt) : -1;
                    // Second, independent signal: the client's own loggedIn flag.
                    // 1 = still drawing the game world. A deliberate logout has
                    // already moved it off the world; a surprise drop has not.
                    var mc = window.__r2h_mc;
                    info.fv = mc ? mc.fv : null;
                    var w = window.__r2hFvWatch;
                    // How long the client had ALREADY left the world before this
                    // close. >0 means fv hit 0 first => deliberate. 0/-1 means the
                    // socket died while the client still believed it was playing.
                    info.fvZeroMsBeforeClose = (w && w.zeroAt) ? (Date.now() - w.zeroAt) : -1;
                    info.fvLastOneMsAgo = (w && w.lastOne) ? (Date.now() - w.lastOne) : -1;
                    info.leftWorldWhileSocketOpen = !!(w && w.leftWhileOpen);
                    // Belt and braces: bM is the client's login-screen state
                    // (this file's own overlay logic reads bM === 0 || bM === 2
                    // as "logo visible"). If fv ever turns out not to move on
                    // logout, bM is the fallback discriminator and one round of
                    // real data settles which to trust.
                    info.bM = mc ? mc.bM : null;
                    info.sockState = (function () {
                        try { return window._r2h_ws ? window._r2h_ws.readyState : null; } catch (e3) { return null; }
                    })();
                } catch (err) { /* ignore */ }
                try { console.log("[R2H] socket closed", JSON.stringify(info)); } catch (err) {}
                try { window.parent.postMessage(info, "*"); } catch(err) {}
            });
            window._r2h_ws = ws;
            return ws;
        };
        window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        window.WebSocket.OPEN = NativeWebSocket.OPEN;
        window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
        window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket.prototype = NativeWebSocket.prototype;
    })();
    </script>

    <!-- R2H Login Bridge: captures canvas event handlers. MUST run before main() -->
    <script>
    (function() {
      'use strict';
      window.__r2hKeyDownHandler = null;
      window.__r2hCanvasRef = null;
      var origAddEventListener = EventTarget.prototype.addEventListener;
      EventTarget.prototype.addEventListener = function(type, listener, options) {
        if (this && this.tagName === 'CANVAS') {
          if (type === 'keydown') window.__r2hKeyDownHandler = listener;
          if (type === 'mousedown' || type === 'touchstart' || type === 'pointerdown') {
            window.__r2hCanvasRef = this;
            window['__r2hMouseHandler_' + type] = listener;
          }
        }
        return origAddEventListener.call(this, type, listener, options);
      };
      window.__r2hTypeChar = function(ch) {
        if (!window.__r2hKeyDownHandler || !window.__r2hCanvasRef) return false;
        var kc = ch.toUpperCase().charCodeAt(0);
        window.__r2hKeyDownHandler.call(window.__r2hCanvasRef, new KeyboardEvent('keydown', {
          key: ch, code: 'Key' + ch.toUpperCase(), keyCode: kc, which: kc, charCode: 0, bubbles: true, cancelable: true
        }));
        return true;
      };
      window.__r2hTypeSpecial = function(key) {
        if (!window.__r2hKeyDownHandler || !window.__r2hCanvasRef) return false;
        var kc = key === 'Tab' ? 9 : 13;
        window.__r2hKeyDownHandler.call(window.__r2hCanvasRef, new KeyboardEvent('keydown', {
          key: key, code: key, keyCode: kc, which: kc, charCode: 0, bubbles: true, cancelable: true
        }));
        return true;
      };
    })();
    </script>

    <!-- R2H Login Fix: intercept first WS send and replace with custom client login -->
    <script>
    (function() {
        var origSend = WebSocket.prototype.send;
        var loginSent = false;
        WebSocket.prototype.send = function(data) {
            if (!loginSent && data && (data.byteLength || (data.buffer && data.buffer.byteLength)) > 10) {
                loginSent = true;
                var u = window.__r2h_login_user || '';
                var p = window.__r2h_login_pass || '';
                if (!u || !p) { return origSend.call(this, data); }
                var VERSION = 10009;
                var payload = [];
                payload.push(0);
                payload.push((VERSION >> 24) & 0xFF, (VERSION >> 16) & 0xFF, (VERSION >> 8) & 0xFF, VERSION & 0xFF);
                for (var i = 0; i < u.length; i++) payload.push(u.charCodeAt(i));
                payload.push(10);
                for (var i = 0; i < p.length; i++) payload.push(p.charCodeAt(i));
                payload.push(10);
                for (var i = 0; i < 8; i++) payload.push(Math.floor(Math.random() * 256));
                var contentLen = payload.length + 1;
                var pkt = new ArrayBuffer(2 + contentLen);
                var v = new DataView(pkt);
                v.setUint16(0, contentLen, false);
                v.setUint8(2, 0);
                for (var i = 0; i < payload.length; i++) v.setUint8(3 + i, payload[i]);
                console.log('[R2H] Custom login: ' + pkt.byteLength + 'B (replaced ' + data.byteLength + 'B)');
                return origSend.call(this, pkt);
            }
            return origSend.call(this, data);
        };
    })();
    </script>

    <!-- Mobile touch fix: long-press right-click only. Browser handles regular taps natively. -->
    <script>
    (function() {
      'use strict';

      function getCanvas() { return document.querySelector('canvas'); }

      function setupTouchHandlers() {
        var canvas = getCanvas();
        if (!canvas) { setTimeout(setupTouchHandlers, 500); return; }

        var holdTimer = null;
        var holdStartX = 0, holdStartY = 0;
        var rightClickActive = false;  // true while finger is down and right-click fired
        var menuOpen = false;          // true after right-click menu is shown, until next tap

        // ── touchstart: decide if this is a tap or a hold ──
        canvas.addEventListener('touchstart', function(e) {
          if (!e.touches || !e.touches[0]) return;
          var t = e.touches[0];

          // If a menu is open, this tap selects/dismisses — let it through
          if (menuOpen) {
            menuOpen = false;
            return; // Don't start hold timer — let the browser's tap go through
          }

          holdStartX = t.clientX;
          holdStartY = t.clientY;
          rightClickActive = false;

          // Slight hold = right-click. 120ms is the shortest time that
          // doesn't trigger on quick taps but feels instant.
          holdTimer = setTimeout(function() {
            rightClickActive = true;
            var handler = window.__r2hMouseHandler_mousedown;
            if (handler) {
              handler.call(canvas, new MouseEvent('mousedown', {
                clientX: t.clientX,
                clientY: t.clientY,
                button: 2,
                buttons: 2,
                bubbles: true, cancelable: true
              }));
            }
          }, 80);
        }, { passive: true });

        // ── touchmove: cancel hold if finger moved (scrolling/dragging) ──
        canvas.addEventListener('touchmove', function(e) {
          if (!e.touches || !e.touches[0]) return;
          var t = e.touches[0];
          if (Math.abs(t.clientX - holdStartX) > 10 || Math.abs(t.clientY - holdStartY) > 10) {
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          }
        }, { passive: true });

        // ── Block ALL synthetic mouse events while right-click is active ──
        // The browser fires mousedown→mouseup→click on finger release.
        // These close the right-click menu. Block them all.
        ['mousedown', 'mouseup', 'click'].forEach(function(evt) {
          canvas.addEventListener(evt, function(e) {
            if (rightClickActive || menuOpen) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }, true);
        });

        // ── touchend: if right-click fired, enter menu mode ──
        canvas.addEventListener('touchend', function(e) {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          if (rightClickActive) {
            e.preventDefault();
            rightClickActive = false;
            menuOpen = true; // Menu stays open until next touchstart
          }
        });

        canvas.addEventListener('touchcancel', function() {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          rightClickActive = false;
        }, { passive: true });

        console.log('[R2H] Touch handlers attached (120ms hold = right-click)');
      }

      setTimeout(setupTouchHandlers, 3000);
    })();
    </script>

    <!-- R2H Activity Monitor (Phase 1 letterbox panel): read-only. Polls the game's
         own stat arrays (mc.kN XP / mc.fw base / mc.hy current) + inventory every 2s
         and postMessages DELTAS to the parent for the side-panel ticker.
         Field names verified in the sealed bot engine (statXp:'kN', statBase:'fw',
         statCurrent:'hy', invItemId:'b4', invAmount:'e2', invCount:'cU', bank:'lD').
         Bank/shop dialogs gate loot detection (withdrawals are NOT loot). -->
    <script>
    (function() {
      'use strict';
      var SKILL_NAMES = ['Attack','Defense','Strength','Hits','Ranged','Prayer','Magic',
        'Cooking','Woodcutting','Fletching','Fishing','Firemaking','Crafting','Smithing',
        'Mining','Herblaw','Agility','Thieving'];
      var lastXp = null, lastBase = null, lastInv = null;

      function snapshot(mc) {
        var xp = [], base = [];
        var xpArr = mc.kN && mc.kN.data, baseArr = mc.fw && mc.fw.data;
        for (var i = 0; i < 18; i++) {
          xp.push(xpArr ? (xpArr[i] || 0) : 0);
          base.push(baseArr ? (baseArr[i] || 0) : 0);
        }
        // inventory: aggregate count per item id (slots 0..cU)
        var inv = {};
        var ids = mc.b4 && mc.b4.data, amts = mc.e2 && mc.e2.data;
        var n = mc.cU || 0;
        for (var s = 0; s < n && s < 30; s++) {
          var id = ids ? ids[s] : 0;
          if (!id) continue;
          inv[id] = (inv[id] || 0) + ((amts && amts[s]) ? amts[s] : 1);
        }
        return { xp: xp, base: base, inv: inv };
      }

      function poll() {
        try {
          var mc = window.__r2h_mc;
          if (!mc || !mc.kN || !mc.kN.data) { setTimeout(poll, 2000); return; }
          var snap = snapshot(mc);
          var events = [];

          if (lastXp) {
            for (var i = 0; i < 18; i++) {
              var d = snap.xp[i] - lastXp[i];
              if (d > 0) {
                var leveled = snap.base[i] > lastBase[i];
                events.push({ kind: leveled ? 'level' : 'xp', skill: i,
                  skillName: SKILL_NAMES[i] || ('skill ' + i), xpGain: d,
                  level: snap.base[i] });
              }
            }
            // loot: inventory gains while NO dialog is open (bank 'lD', shop 'lv')
            if (!mc.lD && !mc.lv) {
              var invEvents = [];
              for (var id in snap.inv) {
                var gain = snap.inv[id] - (lastInv[id] || 0);
                if (gain > 0) invEvents.push({ kind: 'loot', itemId: parseInt(id, 10), count: gain });
              }
              // one event per tick, batched — parent renders a single line
              if (invEvents.length > 0) events.push({ kind: 'lootBatch', items: invEvents });
            }
          }

          if (events.length > 0 && window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'R2H_ACTIVITY', events: events }, '*');
          }
          lastXp = snap.xp; lastBase = snap.base; lastInv = snap.inv;
        } catch (e) { /* never break the game page */ }
        setTimeout(poll, 2000);
      }
      setTimeout(poll, 5000);
    })();
    </script>

    <!-- R2H Area Popup + Position Poller (v2, 2026-09-30).
         Decision logic lives in r2h-area-logic.js (pure, offline-tested in
         tools/test-area-logic.cjs); this block only wires it to the DOM and
         the 500ms poller. READ-ONLY: polls the game's own coordinate fields,
         postMessages to the parent, draws one label above the player's own
         head. Never writes to the client, never contacts any server.

         ⚠️ FIELD NAMES (bJ/bK/du/dd) are minified and version-specific — see
         the header comment in r2h-area-logic.js. After ANY client rebuild /
         classes.js update, re-verify them before trusting the popup. -->
    <script src="r2h-area-logic.js?v=2"></script>
    <script>
    (function() {
      'use strict';

      // ---- Arena guard: the area popup is a main-world feature. ----
      // The iframe hash carries the realm port (43595 = PVP Arena).
      if (/,43595,/.test(window.location.hash)) { return; }

      var POPUP_MS = 2600;
      var popupEl = null;

      // Classic RSC yellow overhead-text style.
      // The local player is always at the CENTRE of the viewport, so "above my
      // own head" = slightly above canvas centre. pointer-events:none so it can
      // NEVER block a game click/touch.
      function ensurePopupEl() {
        if (popupEl) return popupEl;
        var d = document.createElement('div');
        d.id = 'r2h-area-popup';
        d.setAttribute('aria-hidden', 'true');
        d.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);'
          + 'top:calc(38% - 26px);'
          + 'font-family:monospace;font-weight:bold;'
          + 'color:#ffff00;text-shadow:1px 1px 0 #000;'
          + 'background:transparent;pointer-events:none;z-index:5;'
          + 'white-space:nowrap;opacity:0;transition:opacity .25s ease;'
          + '-webkit-user-select:none;user-select:none;'
          + 'font-size:clamp(11px, 2.6vmin, 15px);';
        document.body.appendChild(d);
        popupEl = d;   // FIX: track it — fadeEl/destroyEl depend on this ref
        return d;
      }

      // v2 display controller: full lifecycle, element DESTROYED after fade.
      // Pre-v2 bug: only opacity was reset and the element (with stale text)
      // stayed in the DOM with a live timer — text lingered above the head.
      var display = window.R2HAreaLogic.createPopupDisplay({
        popupMs: POPUP_MS, fadeMs: 250,
        showEl: function (text) {
          var el = ensurePopupEl();
          el.textContent = text;
          el.style.transition = 'none';
          el.style.opacity = '1';
          void el.offsetWidth; // reflow: restart the CSS fade cleanly
          el.style.transition = 'opacity .25s ease';
        },
        fadeEl: function () {
          if (popupEl) popupEl.style.opacity = '0';
        },
        destroyEl: function () {
          if (popupEl && popupEl.parentNode) {
            popupEl.parentNode.removeChild(popupEl);
          }
          popupEl = null;
        }
      });
      var show = display.show;
      var hide = display.hide;
      function post(msg) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(msg, '*');
        }
      }

      var logic = null;

      function start(areas) {
        logic = window.R2HAreaLogic.create({
          areas: areas, show: show, hide: hide, post: post
        });
        setTimeout(function loop() {
          try { logic.tick(window.__r2h_mc); } catch (e) { /* never break game */ }
          setTimeout(loop, logic.POLL_MS);
        }, 5000);
      }

      // fetch the shared area list, then start polling
      try {
        var x = new XMLHttpRequest();
        x.open('GET', 'areas.json?v=1', true);
        x.onload = function() {
          try {
            var j = JSON.parse(x.responseText);
            start((j && j.areas) ? j.areas : []);
          } catch (e) { /* no areas = no popup, fail safe */ }
        };
        x.onerror = function() { /* no areas = no popup */ };
        x.send();
      } catch (e) { /* fail safe */ }
    })();
    </script>

    <!-- R2H Arena Bot Pointer (v4 "True Screen Rim", 2026-10-03).
         Arena-only (world 2). Markers read the RENDERER's own sprite screen
         coords (mc.u.g4 + fe.cJ/dN): a visible bot gets its marker AT the
         sprite; off-screen bots get the rim marker along the fitted camera
         yaw (circular least squares over visible pairs). All markers 62x18,
         10px monospace, four-way outline; no chevron; distance heat on the
         BORDER; leader bright, alternates dim. READ-ONLY for the client: one
         GET poll to /v1/arena/bots; never writes. Guard is the INVERSE of
         the area popup: runs ONLY on the arena realm (hash ,43595,). -->
    <script src="r2h-bot-pointer.js?v=4"></script>
    <script>
    (function() {
      'use strict';

      // ---- Arena-only guard (inverse of the area popup's guard) ----
      if (!/,43595,/.test(window.location.hash)) { return; }

      var layer = null;    // rim layer holding all markers
      var pool = [];       // recycled marker elements

      function ensureLayer() {
        if (layer) return layer;
        layer = document.createElement('div');
        layer.id = 'r2h-bot-rim';
        layer.setAttribute('aria-hidden', 'true');
        layer.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;'
          + 'pointer-events:none;z-index:6;overflow:hidden;';
        document.body.appendChild(layer);
        return layer;
      }

      // Build (or reuse) marker i. All markers 62x18 (worst case "(123) 40+");
      // leader vs alternates differ ONLY by text colour/opacity. Distance
      // heat is the BORDER colour.
      function ensureMarker(i, leader) {
        var m = pool[i];
        if (m) return m;
        m = document.createElement('div');
        m.setAttribute('data-w', '62');
        m.style.cssText = 'position:absolute;'
          + 'width:62px;height:18px;'
          + 'display:flex;align-items:center;'
          + 'background:rgba(4,4,2,0.82);'
          + 'border:1px solid #cfc98f;'
          + 'padding:0 3px;box-sizing:border-box;'
          + 'font-family:monospace;font-weight:bold;font-size:10px;'
          + 'pointer-events:none;'
          + 'opacity:0;transition:opacity .25s ease, left .15s linear, top .15s linear;'
          + '-webkit-user-select:none;user-select:none;';
        var txt = document.createElement('span');
        txt.style.cssText = 'flex-grow:1;text-align:center;'
          + 'color:' + (leader ? '#ffff00' : '#cfc98f') + ';'
          + 'white-space:nowrap;overflow:hidden;'
          + 'text-shadow:1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;';
        m._txt = txt;
        m.appendChild(txt);
        m._opacityTarget = leader ? '1' : '0.62';
        pool[i] = m;
        ensureLayer().appendChild(m);
        return m;
      }

      function show(o) {
        var markers = o.markers || [];
        var i, m, mk;
        for (i = 0; i < markers.length; i++) {
          mk = markers[i];
          m = ensureMarker(i, mk.leader);
          m.style.left = (mk.x - 31) + 'px';
          m.style.top = (mk.y - 9) + 'px';
          m._txt.textContent = '(' + (mk.combat !== null ? mk.combat : '?') + ') ' + mk.tiles;
          m.style.borderColor = mk.heat;
          m.style.opacity = m._opacityTarget;
        }
        for (i = markers.length; i < pool.length; i++) {

        }
      }

      function hide() {
        for (var i = 0; i < pool.length; i++) {
          if (pool[i]) pool[i].style.opacity = '0';
        }
      }

      // Renderer ground-truth reader: every VISIBLE player's world 3D anchor
      // and screen coords (512x345 surface), read from the scene drawables.
      // Verified live: drawables (scene.g4) with hx === scene.fe are sprites;
      // id 20000..29999 are players; vertex 0 of face hn carries cJ (screen x,
      // centred) and dN (screen y at sprite base). tn/tm/tl = anchor x/y/z.
      function getScene() {

          var baseX = Number(mc.du) * 128, baseZ = Number(mc.dd) * 128;
          var out = [];
          var d2 = sc.d2 || 0;
          for (var k = 0; k < d2; k++) {
            var d = sc.g4.data[k];
            if (!d || d.hx !== fe) continue;
            var c = d.hn;

            var face = fe.dt.data[c];
            if (!face || !face.data || !face.data.length) continue;
            var v0 = face.data[0];
            out.push({
              wx: sc.tn.data[c] + baseX,
              wz: sc.tl.data[c] + baseZ,
              sx: fe.cJ.data[v0],
              sy: fe.dN.data[v0]
            });
          }
          return out.length ? out : null;
        } catch (e) {
          return null;   // unreadable this tick: degrade to yaw estimate
        }
      }

      var pointer = window.R2HBotPointer.create({
        fetchBots: function() {
          return fetch('https://api.r2hrsc.xyz/v1/arena/bots', {
            credentials: 'omit'
          }).then(function(r) { return r.json(); });
        },
        show: show,
        hide: hide,
        getScene: getScene,
        getViewport: function() {
          var c = document.querySelector('canvas');
          return c ? { w: c.clientWidth, h: c.clientHeight } : { w: 1280, h: 633 };
        }
      });

      setTimeout(function loop() {
        try { pointer.tick(window.__r2h_mc); } catch (e) { /* never break game */ }
        setTimeout(loop, pointer.TICK_MS);
      }, 5000);
    })();

    <script>
    (function() {

      var _loginActive = false;
      var _loginDone = false;

      window.addEventListener('message', function(e) {
        if (e.origin !== 'https://r2hrsc.xyz' && e.origin !== 'https://www.r2hrsc.xyz' && e.origin !== 'https://robinscape.xyz' && e.origin !== 'https://www.robinscape.xyz' && e.origin !== 'https://runescapeclassic.gold' && e.origin !== 'https://www.runescapeclassic.gold') return;
        if (!e.data || e.data.type !== 'RSC_LOGIN') return;

        var username = e.data.username;
        var password = e.data.password;
        window.__r2h_login_user = username;
        window.__r2h_login_pass = password;
        window.parent.postMessage({ type: 'rsc-login-received' }, '*');

        if (_loginDone || _loginActive) {
          window.parent.postMessage({ type: 'rsc-login-complete' }, '*');
          return;
        }
        _loginActive = true;

        function runLoginSequence() {
          var mcWaitCount = 0;
          var mcWaitInterval = setInterval(function() {
            mcWaitCount++;
            if (!window.__r2h_mc) {
              if (mcWaitCount > 300) {
                clearInterval(mcWaitInterval);
                window.parent.postMessage({ type: 'rsc-login-error', detail: 'Game engine not ready' }, '*');
                _loginActive = false;
              }
              return;
            }
            var mc = window.__r2h_mc;
            if (!mc.Y || (!mc.g1 && mc.g1 !== 0) || (!mc.uw && mc.uw !== 0)) {
              if (mcWaitCount > 300) {
                clearInterval(mcWaitInterval);
                window.parent.postMessage({ type: 'rsc-login-error', detail: 'Login screen not ready' }, '*');
                _loginActive = false;
              }
              return;
            }
            if (mc.g1 === 0 && mc.g2 === 0) return;

            clearInterval(mcWaitInterval);
            try {
              var rscUser = window.__r2h_rt_str(username);
              var rscPass = window.__r2h_rt_str(password);
              mc.eN = rscUser;
              mc.eD = rscPass;
              window.__r2h_startThread(function() {
                window.__r2h_Ob(mc, rscUser, rscPass, false);
              });
            } catch(e) {
              window.parent.postMessage({ type: 'rsc-login-error', detail: 'Login failed: ' + e.message }, '*');
              _loginActive = false;
              return;
            }

            var checkStart = Date.now();
            var checkInterval = setInterval(function() {
              if (window._r2h_ws_open) {
                clearInterval(checkInterval);
                _loginDone = true;
                window.parent.postMessage({ type: 'rsc-login-complete' }, '*');
                _loginActive = false;
              } else if (Date.now() - checkStart > 30000) {
                clearInterval(checkInterval);
                window.parent.postMessage({ type: 'rsc-login-error', detail: 'Login timed out' }, '*');
                _loginActive = false;
              }
            }, 500);
          }, 200);
        }

        var waitCount = 0;
        var waitInterval = setInterval(function() {
          var canvas = document.querySelector('canvas');
          waitCount++;
          if (canvas && canvas.width > 100) {
            clearInterval(waitInterval);
            setTimeout(runLoginSequence, 2000);
          } else if (waitCount > 300) {
            clearInterval(waitInterval);
            window.parent.postMessage({ type: 'rsc-login-error', detail: 'Game canvas not ready' }, '*');
            _loginActive = false;
          }
        }, 200);
      });
    })();

      function currentOverlayState() {
        return false; // REVERTED-TO-ORIGINAL-ART 2026-09-24: never show custom overlay (use game's own login art)
        // Hide ONLY when the CLIENT says it's in-game (mc.fv = loggedIn:

        if (want !== shown) {

          box.style.display = want ? 'block' : 'none';

      setInterval(tick, 250);
      tick();
    })();
