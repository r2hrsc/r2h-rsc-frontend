<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuneScape Classic — Play Free in Your Browser</title>
    <meta
      name="description"
      content="Classic RuneScape, live again. Free to play in your browser — no download, no install. Sign in with Google or a crypto wallet and you're in Lumbridge in seconds."
    />
    <link rel="canonical" href="https://runescapeclassic.gold/" />
    <link rel="icon" type="image/svg+xml" href="/icons/sword.svg" />

    <!-- Open Graph — drives the preview card on Discord, Telegram and Facebook.
         Without these a shared link renders as a bare URL with no image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RuneScape Classic" />
    <meta property="og:url" content="https://runescapeclassic.gold/" />
    <meta property="og:title" content="RuneScape Classic — Play Free in Your Browser" />
    <meta
      property="og:description"
      content="Classic RuneScape, live again. Free to play in your browser — no download, no install. Sign in and you're in Lumbridge in seconds."
    />
    <meta property="og:image" content="https://runescapeclassic.gold/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RuneScape Classic — free to play in your browser" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@runeclassicgp" />
    <meta name="twitter:creator" content="@runeclassicgp" />
    <meta name="twitter:title" content="RuneScape Classic — Play Free in Your Browser" />
    <meta
      name="twitter:description"
      content="Classic RuneScape, live again. Free to play in your browser — no download, no install."
    />
    <meta name="twitter:image" content="https://runescapeclassic.gold/og-image.png" />

    <!-- Retro-Futurism HUD fonts (Orbitron display + JetBrains Mono data).
         Loaded via <link> — a mid-file CSS @import is silently dropped by the
         bundler, which left production on generic fallback fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
