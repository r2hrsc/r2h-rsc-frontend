# robinscape.xyz — alias of r2hrsc.xyz (additive deploy 2026-09-12)
# Serves the same frontend build (commit b3f29e4) from /var/www/robinscape-frontend.
# REVERT: delete this file + revert.sh restores DNS.
server {
    listen 80;
    listen [::]:80;
    server_name robinscape.xyz www.robinscape.xyz;

    root /var/www/robinscape-frontend;
    index index.html;

    # Mirrors Cloudflare Pages _redirects: SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors _headers content types
    location = /ads.txt { default_type text/plain; }
    location = /robots.txt { default_type text/plain; }

    # Immutable asset caching (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /game/* — static copies under the frontend root (login-logo etc.)
    location /game/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }
}
