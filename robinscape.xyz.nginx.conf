# robinscape.xyz — 301 redirect to runescapeclassic.gold (2026-10-01)
#
# Previously served the same frontend build from /var/www/robinscape-frontend,
# which split SEO between two byte-identical sites and kept a retired brand
# live. It now redirects instead. The webroot is deliberately LEFT ON DISK as
# the rollback path — it is simply no longer served.
#
# The TLS block below is kept IN FULL and must stay that way: a browser
# completes the TLS handshake BEFORE it ever sees a redirect, so removing the
# certificate would turn this into a certificate error rather than a redirect.
# Renewal uses the nginx authenticator (see
# /etc/letsencrypt/renewal/robinscape.xyz.conf); if that ever changes to
# webroot, the acme-challenge location below keeps http-01 working.
#
# The gc-root-75 sub_filter snippet that used to be included here was dropped
# on purpose: it rewrote served CSS, and this host no longer serves any. It
# remains in the runescapeclassic.gold site, which is untouched.
#
# REVERT:
#   cp /root/nginx-backup-20261001-301/robinscape.xyz \
#      /etc/nginx/sites-available/robinscape.xyz && nginx -t && systemctl reload nginx

server {
    server_name robinscape.xyz www.robinscape.xyz;

    # Never redirect ACME challenges, so certificate renewal cannot be broken
    # by this redirect regardless of which authenticator is in use.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/robinscape-frontend;
    }

    location / {
        return 301 https://runescapeclassic.gold$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/robinscape.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/robinscape.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.robinscape.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = robinscape.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name robinscape.xyz www.robinscape.xyz;
    return 404; # managed by Certbot




}
